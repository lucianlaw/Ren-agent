name: ci

# 这个 workflow 只干一件事：让「能不能合」不取决于维护者当时有没有空。
# 五道发布闸门原本跑在维护者本机（scripts/release.mjs），PR 进来时没人替你跑。
# 所以这里把它搬进容器 —— 同一份脚本、同一个结论，谁按都一样。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: 全量测试 + 发布闸门
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # release.mjs 要读完整历史判断工作区状态，浅克隆会误判
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 项目零依赖，没有 npm ci 这一步。跑 install 只会多花 20 秒并失败。

      # runner 是非 root 的 Linux，也没有 bwrap —— 隔离探测会落在「none」，
      # 于是 run_shell 按设计拒绝执行。这件事必须写在日志最前面，
      # 否则下一次「本机能过、CI 不过」又得从头猜。同时也是本机没有的能力自述。
      - name: 环境自述（隔离能力）
        run: |
          node -e "import('./lib/sandbox.js').then(m=>{const r=m.probeRuntime();
            console.log('platform :', r.platform);
            console.log('root     :', r.root);
            console.log('mode     :', r.mode);
            console.log('why      :', r.why || '(无)');
          })"

      # 逐个文件跑，失败时打一行 ::error:: —— 这样失败点会出现在 checks 注解里，
      # 不必下载日志才能知道红在哪个文件。npm test 一次跑完只在末尾报 exit 1。
      - name: 全量测试
        run: |
          for f in test/*.mjs; do
            if ! node "$f"; then
              echo "::error file=$f::$(basename "$f") 失败"
              exit 1
            fi
          done

      - name: 发布闸门（只跑门，不写 build.json）
        run: node scripts/release.mjs --check

      - name: 密钥与运行时数据不该被提交
        run: |
          bad=$(git ls-files | grep -E '^(data/|\.ren-secrets/|\.ren-state/|build\.json|admins\.local\.json)|\.genie$' || true)
          if [ -n "$bad" ]; then
            echo "这些文件不该进仓库："
            echo "$bad"
            exit 1
          fi
